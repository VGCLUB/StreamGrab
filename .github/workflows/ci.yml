name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and Qt headless runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run local-fixture tests
        run: python -m pytest -q --junitxml=qa/test-results.xml
